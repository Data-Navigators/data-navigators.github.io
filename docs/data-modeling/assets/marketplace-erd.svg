<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace order entity relationship diagram</title>
  <desc id="desc">A relationship diagram showing customers, orders, order items, products, categories, and shipments with primary keys, foreign keys, and one-to-many cardinality.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#52677a"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52677a; }
      .table-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .field { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .key { font-weight: 700; fill: #8a3b12; }
      .cardinality { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #274c77; }
      .relationship { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52677a; }
      .table { fill: #ffffff; stroke: #b9c5cf; stroke-width: 2; }
      .header { fill: #274c77; }
      .note { fill: #fff7e6; stroke: #e2b45a; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f5f7f9"/>
  <text x="60" y="58" class="title">Marketplace order model</text>
  <text x="60" y="88" class="subtitle">Keys identify rows; relationships connect business entities without changing their grain.</text>

  <!-- Relationships behind tables -->
  <line x1="290" y1="285" x2="410" y2="285" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="263" class="cardinality">1</text>
  <text x="350" y="263" class="cardinality">many</text>
  <text x="304" y="315" class="relationship">customer_id</text>

  <line x1="710" y1="285" x2="820" y2="285" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="716" y="263" class="cardinality">1</text>
  <text x="755" y="263" class="cardinality">many</text>
  <text x="723" y="315" class="relationship">order_id</text>

  <line x1="1160" y1="285" x2="1270" y2="285" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1166" y="263" class="cardinality">many</text>
  <text x="1235" y="263" class="cardinality">1</text>
  <text x="1172" y="315" class="relationship">product_id</text>

  <line x1="1360" y1="500" x2="1360" y2="610" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1375" y="535" class="cardinality">many</text>
  <text x="1375" y="590" class="cardinality">1</text>
  <text x="1390" y="565" class="relationship">category_id</text>

  <line x1="560" y1="500" x2="560" y2="610" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="575" y="535" class="cardinality">1</text>
  <text x="575" y="590" class="cardinality">many</text>
  <text x="590" y="565" class="relationship">order_id</text>

  <!-- Customers -->
  <g transform="translate(50 180)">
    <rect width="240" height="320" rx="6" class="table"/>
    <rect width="240" height="48" rx="6" class="header"/>
    <text x="18" y="31" class="table-title">customers</text>
    <text x="18" y="82" class="field key">PK  customer_id</text>
    <text x="18" y="116" class="field">customer_name</text>
    <text x="18" y="150" class="field">customer_segment</text>
    <text x="18" y="184" class="field">city</text>
    <text x="18" y="218" class="field">contact_email</text>
    <text x="18" y="252" class="field">created_date</text>
  </g>

  <!-- Orders -->
  <g transform="translate(410 180)">
    <rect width="300" height="320" rx="6" class="table"/>
    <rect width="300" height="48" rx="6" class="header"/>
    <text x="18" y="31" class="table-title">orders</text>
    <text x="18" y="82" class="field key">PK  order_id</text>
    <text x="18" y="116" class="field key">FK  customer_id</text>
    <text x="18" y="150" class="field">order_date</text>
    <text x="18" y="184" class="field">order_status</text>
    <text x="18" y="218" class="field">delivery_days</text>
    <text x="18" y="252" class="field">total_amount</text>
  </g>

  <!-- Order items -->
  <g transform="translate(820 180)">
    <rect width="340" height="320" rx="6" class="table"/>
    <rect width="340" height="48" rx="6" class="header"/>
    <text x="18" y="31" class="table-title">order_items</text>
    <text x="18" y="82" class="field key">PK  order_item_id</text>
    <text x="18" y="116" class="field key">FK  order_id</text>
    <text x="18" y="150" class="field key">FK  product_id</text>
    <text x="18" y="184" class="field">quantity</text>
    <text x="18" y="218" class="field">discount_pct</text>
    <text x="18" y="252" class="field">line_amount</text>
  </g>

  <!-- Products -->
  <g transform="translate(1270 180)">
    <rect width="280" height="320" rx="6" class="table"/>
    <rect width="280" height="48" rx="6" class="header"/>
    <text x="18" y="31" class="table-title">products</text>
    <text x="18" y="82" class="field key">PK  product_id</text>
    <text x="18" y="116" class="field key">FK  category_id</text>
    <text x="18" y="150" class="field">product_name</text>
    <text x="18" y="184" class="field">unit_price</text>
    <text x="18" y="218" class="field">active_flag</text>
  </g>

  <!-- Shipments -->
  <g transform="translate(410 610)">
    <rect width="300" height="210" rx="6" class="table"/>
    <rect width="300" height="48" rx="6" class="header"/>
    <text x="18" y="31" class="table-title">shipments</text>
    <text x="18" y="82" class="field key">PK  shipment_id</text>
    <text x="18" y="116" class="field key">FK  order_id</text>
    <text x="18" y="150" class="field">shipment_status</text>
    <text x="18" y="184" class="field">carrier</text>
  </g>

  <!-- Categories -->
  <g transform="translate(1210 610)">
    <rect width="300" height="210" rx="6" class="table"/>
    <rect width="300" height="48" rx="6" class="header"/>
    <text x="18" y="31" class="table-title">categories</text>
    <text x="18" y="82" class="field key">PK  category_id</text>
    <text x="18" y="116" class="field">category_name</text>
    <text x="18" y="150" class="field">department</text>
  </g>

  <rect x="760" y="650" width="360" height="105" rx="6" class="note"/>
  <text x="785" y="682" class="field key">How to read this model</text>
  <text x="785" y="710" class="field">PK = primary key; FK = foreign key.</text>
  <text x="785" y="735" class="field">Each connector is a relationship, not a flat join.</text>
</svg>
